<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />

  <title>G. Curtis Parsons | Out Here, Monsters</title>
  <meta name="description" content="Official website of G. Curtis Parsons." />

  <link rel="stylesheet" href="/assets/css/main.css?v=7" />
  <script src="/assets/js/main.js?v=7" defer></script>
</head>

<body class="home-page">
  <header class="site-header">
    <div class="site-header-inner">
      <a class="brand" href="/" aria-label="G. Curtis Parsons home">
        G. CURTIS PARSONS
      </a>

      <button
        class="menu-toggle"
        type="button"
        aria-label="Open navigation"
        aria-expanded="false"
        aria-controls="site-nav"
      >
        <span></span>
        <span></span>
      </button>

      <nav class="site-nav" id="site-nav" aria-label="Primary navigation">
        <a href="/#works">WORKS</a>
        <a href="/pages/author.html">AUTHOR</a>
        <a href="/#contact">CONTACT</a>
      </nav>
    </div>
  </header>

  <main id="main-content">

    <section class="hero" aria-labelledby="hero-title">
      <div class="hero-inner">
        <div class="hero-copy">
          <h1 class="hero-title" id="hero-title">
            OUT HERE, MONSTERS
            <span>G. CURTIS PARSONS</span>
          </h1>

          <div class="hero-accent"></div>

          <p class="hero-status">
            Official site currently under construction
          </p>
        </div>
      </div>
    </section>

    <section
      class="works-preview"
      id="works"
      aria-labelledby="works-title"
    >
      <div class="section-heading">
        <span></span>
        <h2 id="works-title">WORKS</h2>
        <span></span>
      </div>

      <div class="works-carousel" data-carousel>
        <button
          class="carousel-arrow carousel-prev"
          type="button"
          aria-label="Previous work"
        >
          &#10094;
        </button>

        <div
          class="works-track"
          data-carousel-track
          tabindex="0"
        >

          <article class="work-card work-card-featured">
            <a href="/pages/works.html#out-here-monsters">
              <div class="work-cover">
                <img
                  src="/images/covers/ohm-cover.png"
                  alt="Out Here, Monsters cover"
                  data-fallback-title="OUT HERE, MONSTERS"
                  loading="eager"
                />
              </div>

              <div class="work-status">
                PURCHASE
              </div>
            </a>
          </article>

          <article class="work-card">
            <a href="/pages/works.html#can-we-talk-about-lunch">
              <div class="work-cover">
                <img
                  src="/images/covers/cwtal-cover.png"
                  alt="Can We Talk About Lunch? cover"
                  data-fallback-title="CAN WE TALK ABOUT LUNCH?"
                  loading="lazy"
                />
              </div>

              <div class="work-status">
                COMING SOON
              </div>
            </a>
          </article>

          <article class="work-card">
            <a href="/pages/works.html#garou">
              <div class="work-cover">
                <img
                  src="/images/covers/garou-cover.png"
                  alt="Garou cover"
                  data-fallback-title="GAROU"
                  loading="lazy"
                />
              </div>

              <div class="work-status">
                COMING SOON
              </div>
            </a>
          </article>

        </div>

        <button
          class="carousel-arrow carousel-next"
          type="button"
          aria-label="Next work"
        >
          &#10095;
        </button>
      </div>

      <div
        class="carousel-dots"
        data-carousel-dots
        aria-label="Works carousel navigation"
      >
        <button
          class="carousel-dot active"
          type="button"
          aria-label="Out Here, Monsters"
        ></button>

        <button
          class="carousel-dot"
          type="button"
          aria-label="Can We Talk About Lunch?"
        ></button>

        <button
          class="carousel-dot"
          type="button"
          aria-label="Garou"
        ></button>
      </div>

      <div class="section-action">
        <a
          class="text-link"
          href="/pages/works.html"
        >
          VIEW WORKS
        </a>
      </div>
    </section>

    <section
      class="author-preview"
      id="author"
      aria-labelledby="author-title"
    >
      <div class="author-image">
        <img
          src="/images/profile/profile.png"
          alt="G. Curtis Parsons"
          loading="lazy"
        />
      </div>

      <div class="author-content">
        <h2 id="author-title">
          G. CURTIS PARSONS
        </h2>

        <span class="author-accent"></span>
        <div class="author-rule"></div>

        <a
          class="text-link"
          href="/pages/author.html"
        >
          AUTHOR
        </a>
      </div>
    </section>

  </main>

  <footer
    class="site-footer"
    id="contact"
  >
    <div class="footer-domain">
      <span></span>
      <p>gcparsons.ca</p>
      <span></span>
    </div>

    <div class="footer-copy">
      &copy; 2026 G. Curtis Parsons
    </div>
  </footer>

</body>
</html>
